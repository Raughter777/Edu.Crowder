<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The New Heights Christian Academy Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #096d54;
      color: white;
      padding: 30px;
      text-align: center;
    }
    header h1 {
      margin: 0;
    }
    main {
      max-width: 800px;
      margin: 50px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h2 {
      color: #096d54;
    }
    p {
      font-size: 18px;
    }
    .menu {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .menu button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #096d54;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .menu button:hover {
      background-color: #074f3e;
    }
  </style>
</head>
<body>


  <header>
    <h1>The New Heights Christian Academy Portal</h1>
    <p>Official Student Learning Portal</p>
  </header>


  <main>
    <h2>Welcome, student.</h2>
    <p>Select your assigned module below:</p>


    <div class="menu">
      <button onclick="window.location.href='https://www.coolmathgames.com/'">Homework</button>
      <button onclick="window.location.href='https://sites.google.com/view/ultimate-unblockedgames/poly-track'">Math Practice</button>
      <button onclick="window.location.href='https://www.culinaryschools.org/kids-games/watermelon-game/'">Science Lab</button>
    </div>
  </main>


</body>
</html>
